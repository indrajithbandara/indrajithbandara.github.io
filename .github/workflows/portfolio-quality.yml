name: Portfolio quality
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in assets/js/*.js tools/*.mjs sw.js; do node --check "$file"; done
      - run: node tools/validate.mjs
      - run: python3 tools/test_recommendations.py
      - run: python3 -m json.tool badges.json > /dev/null
      - run: python3 -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml')"
      - run: test -f assets/css/roadmap.css && test -f index.html
      - run: npm install --no-save --package-lock=false playwright@1.58.2 @axe-core/playwright@4.10.2 parse5@7.3.0 ajv@8.17.1
      - run: node tools/validate-structured.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          python3 -m http.server 8000 &
          test_pid=$!
          trap 'kill "$test_pid" 2>/dev/null || true' EXIT
          node tools/browser-test.mjs
          node tools/platform-test.mjs
          REC_CHROMIUM_ONLY=1 node tools/recommendations-test.mjs
      - name: Cross-engine skills checks over HTTPS
        run: |
          certdir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$certdir/key.pem" -out "$certdir/cert.pem" -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'
          python3 -c 'import http.server,ssl,sys; p=sys.argv[1]; s=http.server.ThreadingHTTPServer(("127.0.0.1",8443),http.server.SimpleHTTPRequestHandler); c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER); c.load_cert_chain(p+"/cert.pem",p+"/key.pem"); s.socket=c.wrap_socket(s.socket,server_side=True); s.serve_forever()' "$certdir" &
          test_pid=$!
          trap 'kill "$test_pid" 2>/dev/null || true' EXIT
          curl -k --retry 5 --retry-connrefused -fsS https://127.0.0.1:8443/ > /dev/null
          PORTFOLIO_URL=https://127.0.0.1:8443/ node tools/skills-smoke.mjs
          PORTFOLIO_URL=https://127.0.0.1:8443/ node tools/cinematic-test.mjs
          PORTFOLIO_URL=https://127.0.0.1:8443/ node tools/recommendations-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: technical-skills-screenshots
          path: qa-screenshots/
      - name: Compare Lighthouse before and after platform expansion
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --no-save --package-lock=false lighthouse@12.8.2 playwright@1.58.2
          baseline_dir=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
          python3 -m http.server 8000 &
          current_pid=$!
          python3 -m http.server 8001 --directory "$baseline_dir" &
          baseline_pid=$!
          trap 'kill "$current_pid" "$baseline_pid" 2>/dev/null || true' EXIT
          node tools/performance-test.mjs
          node tools/cinematic-visual.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: cinematic-scroll-evidence
          path: qa-screenshots/
      - name: Verify deployed website at mobile and desktop widths
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/production-test.mjs
      - name: Exercise all deployed platform views
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PORTFOLIO_URL: https://indrajithbandara.is-a.dev/
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 @axe-core/playwright@4.10.2
          node tools/platform-test.mjs
          node tools/cinematic-test.mjs
          node tools/recommendations-test.mjs
      - name: Measure live production Lighthouse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIGHTHOUSE_PRODUCTION_URL: https://indrajithbandara.is-a.dev/
        run: |
          npm install --no-save --package-lock=false lighthouse@12.8.2 playwright@1.58.2
          node tools/performance-test.mjs
