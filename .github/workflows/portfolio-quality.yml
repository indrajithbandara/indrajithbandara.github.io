name: Portfolio quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/main.js && node --check assets/js/roadmap.js
      - run: python3 -m json.tool badges.json > /dev/null
      - run: python3 -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml')"
      - run: test -f assets/css/roadmap.css && test -f index.html
